  <style>
    /* ===== MESA DE CORTE: cambia estos valores para personalizarla =====
       --mesa-fondo: color de la mesa (verde por defecto; prueba #2f6fb3 para azul o #8a4f9e para morado)
       Para quitar los lápices y demás objetos, borra los <div class="obj"> dentro de <div class="mesa"> (más abajo, en el <body>). */
    :root {
      --mesa-fondo: #3f8444;
      --mesa-linea: 241, 236, 170; /* color de la cuadrícula, en formato R, G, B */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
    }
    body {
      background-color: var(--mesa-fondo);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh; /* en celulares descuenta la barra del navegador */
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ===== Mesa de corte realista ===== */
    .mesa {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background-color: var(--mesa-fondo);
      --g: 120px; /* tamaño de cada cuadro grande; el script lo ajusta al tamaño de la pantalla */

    .mesa .capa {
      position: absolute;
      inset: 0;

      background-size: var(--g) var(--g), var(--g) var(--g), calc(var(--g) / 4) calc(var(--g) / 4), calc(var(--g) / 4) calc(var(--g) / 4);
      -webkit-mask-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPSc2NDAnIGhlaWdodD0nNjQwJz48ZmlsdGVyIGlkPSdmJyBjb2xvci1pbnRlcnBvbGF0aW9uLWZpbHRlcnM9J3NSR0InIHg9JzAnIHk9JzAnIHdpZHRoPScxMDAlJyBoZWlnaHQ9JzEwMCUnPjxmZVR1cmJ1bGVuY2UgdHlwZT0nZnJhY3RhbE5vaXNlJyBiYXNlRnJlcXVlbmN5PScwLjAzJyBudW1PY3RhdmVzPSc1JyBzZWVkPSc5JyBzdGl0Y2hUaWxlcz0nc3RpdGNoJy8+PGZlQ29sb3JNYXRyaXggdmFsdWVzPScwIDAgMCAwIDAgIDAgMCAwIDAgMCAgMCAwIDAgMCAwICAwIDAgMCAzLjQgLTAuNjInLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0nMTAwJScgaGVpZ2h0PScxMDAlJyBmaWx0ZXI9J3VybCgjZiknLz48L3N2Zz4=");
      mask-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPSc2NDAnIGhlaWdodD0nNjQwJz48ZmlsdGVyIGlkPSdmJyBjb2xvci1pbnRlcnBvbGF0aW9uLWZpbHRlcnM9J3NSR0InIHg9JzAnIHk9JzAnIHdpZHRoPScxMDAlJyBoZWlnaHQ9JzEwMCUnPjxmZVR1cmJ1bGVuY2UgdHlwZT0nZnJhY3RhbE5vaXNlJyBiYXNlRnJlcXVlbmN5PScwLjAzJyBudW1PY3RhdmVzPSc1JyBzZWVkPSc5JyBzdGl0Y2hUaWxlcz0nc3RpdGNoJy8+PGZlQ29sb3JNYXRyaXggdmFsdWVzPScwIDAgMCAwIDAgIDAgMCAwIDAgMCAgMCAwIDAgMCAwICAwIDAgMCAzLjQgLTAuNjInLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0nMTAwJScgaGVpZ2h0PScxMDAlJyBmaWx0ZXI9J3VybCgjZiknLz48L3N2Zz4=");

      mask-size: 640px 640px;

    /* numeración de los bordes, como en una mesa de corte de verdad */
    .mesa .nums span {
      position: absolute;
      font: 600 11px/1 system-ui, -apple-system, sans-serif;
      color: rgba(var(--mesa-linea), 0.78);
      letter-spacing: 0.04em;
    }
    .mesa .nums span.d { text-align: right; }
    /* luz de ventana desde arriba a la izquierda + viñeta en los bordes */
    .mesa .luz {
      background:
        radial-gradient(ellipse at 24% 14%, rgba(255, 255, 225, 0.12) 0%, rgba(255, 255, 225, 0) 52%),
        radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0) 58%, rgba(0, 0, 0, 0.28) 100%);
    }

    /* Objetos de papelería: la sombra va en el contenedor para que siempre caiga hacia el mismo lado */
    .obj {
      position: absolute;
      width: calc(var(--w) * max(1vmin, 0.55vmax));
      filter: drop-shadow(1px 2px 1px rgba(0, 0, 0, 0.5)) drop-shadow(6px 11px 8px rgba(0, 0, 0, 0.32));
    }
    .obj svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
      transform: rotate(var(--r, 0deg));
    }

    /* Escenario principal */
    .viewport {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      z-index: 1; /* por encima de la mesa de corte */
      touch-action: none; /* los gestos (pellizcar, arrastrar, deslizar) los maneja el script */
    }

    #zoomContainer {
      transform-origin: center center;
      transition: transform 0.2s ease-out;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #zoomContainer.zoomed {
      cursor: grab;
    }
    #zoomContainer.zoomed:active {
      cursor: grabbing;
    }

    /* Contenedor del pliego abierto (2 páginas A4 juntas) */
    .book-scene {
      /* El tamaño exacto lo calcula fitBook() en el script; esto es solo un valor de respaldo */
      height: min(82vh, 62vw);
      aspect-ratio: 2 / 1.4142;
      flex: none;
      position: relative;
      perspective: 4500px; /* se ajusta en fitBook(); más alto = giro más natural, menos deformado */
      /* misma duración y curva que el giro de la hoja, para que el libro y la hoja se muevan a la par */
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Centrar cuando está cerrado en portada o contraportada */
    .book-scene.closed-front {
      transform: translateX(-25%);
    }
    .book-scene.closed-back {
      transform: translateX(25%);
    }

    /* Sombra única del libro y canto de hojas (una sola, en vez de una por hoja) */
    .book-spine-shadow {
      position: absolute;
      inset: 0;
      border-radius: 3px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease; /* al cerrar el libro desaparece de inmediato */
      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.5),
        -4px 0 0 -1px #e5e5e5,
        -5px 0 0 -1px #888888,
        4px 0 0 -1px #e5e5e5,
        5px 0 0 -1px #888888;
    }
    .book-scene.is-open .book-spine-shadow {
      opacity: 1;
      transition-delay: 0.35s; /* aparece cuando la hoja ya casi aterrizó, sin dejar un hueco vacío */
    }

    /* Cada hoja física (ocupa la mitad derecha y rota hacia la mitad izquierda) */
    .sheet {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    .sheet.turning {
      will-change: transform; /* solo la hoja que gira usa aceleración extra */
    }
    .sheet.far {
      visibility: hidden; /* hojas lejanas: no se dibujan, así sobra memoria y fluidez */
    }

    .sheet.flipped {
      transform: rotateY(-180deg);
    }

    /* Caras de cada hoja (sin sombra propia: las sombras de 18 hojas se acumulaban en negro) */
    .face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    .face.back {
      transform: rotateY(180deg);
    }

    .face img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .face.ready img {
      opacity: 1; /* la imagen aparece solo cuando ya está lista, sin parpadeos en blanco */
    }

    .face.loading::before {
      content: "Cargando…";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #9a9a9a;
    }

    /* Si una imagen no se encuentra, se avisa con el nombre del archivo que falló */
    .face.missing::before {
      content: "No se encontró la imagen\A" attr(data-file);
      white-space: pre-wrap;
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      font-size: 14px;
      color: #b00020;
      background: #fafafa;
    }

    /* Sombreado que se oscurece mientras la hoja gira, para dar sensación de volumen */
    .shade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
    }
    .face.front .shade {
      background: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 100%);
    }
    .face.back .shade {
      background: linear-gradient(to left, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 100%);
    }
    .sheet.turning .shade {
      animation: shade 0.7s ease-in-out;
    }
    @keyframes shade {
      0%, 100% { opacity: 0; }
      50% { opacity: 0.55; }
    }

    /* Sombra del pliegue central (unión de las dos páginas) */
    .face.front::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 34px;
      height: 100%;
      background: linear-gradient(to right, rgba(0,0,0,0.26) 0%, rgba(0,0,0,0.06) 55%, transparent 100%);
      pointer-events: none;
    }

    .face.back::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 34px;
      height: 100%;
      background: linear-gradient(to left, rgba(0,0,0,0.26) 0%, rgba(0,0,0,0.06) 55%, transparent 100%);
      pointer-events: none;
    }

    /* Quitar sombra central en portada y contraportada */
    .sheet.is-cover .face.front::after,
    .sheet.is-backcover .face.back::after {
      display: none;
    }

    /* Sombra suave solo en portada y contraportada (una sola, no una por hoja) */
    .sheet.is-cover .face.front,
    .sheet.is-backcover .face.back {
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
    }

    /* Barra de controles inferior */
    .controls {
      flex: none;
      min-height: 65px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 8px 12px;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn {
      /* botones oscuros y translúcidos: se leen bien sobre cualquier fondo, claro u oscuro */
      background-color: rgba(15, 25, 45, 0.72);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.28);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      transition: background-color 0.2s ease;
    }
    .btn:hover {
      background-color: rgba(15, 25, 45, 0.92);
    }
    .btn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .btn-icon {
      padding: 8px 13px;
      font-size: 15px;
    }

    .page-info {
      color: #ffffff;
      background: rgba(15, 25, 45, 0.72);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
      min-width: 145px;
      text-align: center;
    }

    .hint {
      display: none;
      width: 100%;
      text-align: center;
      color: #e4ebf5;
      background: rgba(15, 25, 45, 0.72);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
    }

    /* Celulares en vertical */
    @media (max-width: 700px) and (orientation: portrait) {
      .hint { display: block; }
      .btn-group { flex-wrap: wrap; justify-content: center; }
      .page-info { order: -1; flex-basis: 100%; min-width: 0; }
      .btn { padding: 8px 12px; font-size: 13px; }
    }

    /* Celulares en horizontal (poca altura) */
    @media (max-height: 500px) {
      .controls { min-height: 48px; padding: 5px 10px; }
      .btn { padding: 6px 12px; font-size: 13px; }
    }

    /* Personas que piden menos animaciones en su dispositivo */
    @media (prefers-reduced-motion: reduce) {
      .sheet, .book-scene { transition-duration: 0.01s; }
      .sheet.turning .shade { animation: none; }
    }
  </style>
</head>

">18</text><text x="380" y="38" font-size="9" font-weight="600" text-anchor="middle" fill="rgba(255,255,255,.95)">19</text><text x="400" y="38" font-size="9" font-weight="600" text-anchor="middle" fill="rgba(255,255,255,.95)">20</text><text x="420" y="38" font-size="9" font-weight="600" text-anchor="middle" fill="rgba(255,255,255,.95)">21</text><text x="440" y="38" font-size="9" font-weight="600" text-anchor="middle" fill="rgba(255,255,255,.95)">22</text><text x="460" y="38" font-size="9" font-weight="600" text-anchor="middle" fill="rgba(255,255,255,.95)">23</text><text x="480" y="38" font-size="9" font-weight="600" text-anchor="middle" fill="rgba(255,255,255,.95)">24</text><text x="500" y="38" font-size="9" font-weight="600" text-anchor="middle" fill="rgba(255,255,255,.95)">25</text><text x="520" y="38" font-size="9" font-weight="600" text-anchor="middle" fill="rgba(255,255,255,.95)">26</text><text x="540" y="38" font-size="9" font-weight="600" text-anchor="middle" fill="rgba(255,255,255,.95)">27</text><text x="560" y="38" font-size="9" font-weight="600" text-anchor="middle" fill="rgba(255,255,255,.95)">28</text><text x="580" y="38" font-size="9" font-weight="600" text-anchor="middle" fill="rgba(255,255,255,.95)">29</text>

  <div class="viewport" id="viewport">
    <div id="zoomContainer">
      <div class="book-scene closed-front" id="bookScene">
        <div class="book-spine-shadow"></div>
        <!-- Las hojas se generan aquí -->
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="btn-group">
      <button class="btn" id="prevBtn">← Anterior</button>
      <span class="page-info" id="pageNumber">Portada</span>
      <button class="btn" id="nextBtn">Siguiente →</button>
    </div>

    <div class="btn-group">
      <button class="btn btn-icon" id="zoomOutBtn" title="Alejar">−</button>
      <button class="btn btn-icon" id="zoomResetBtn" title="Restablecer">100%</button>
      <button class="btn btn-icon" id="zoomInBtn" title="Acercar">+</button>
    </div>

    <button class="btn" id="fullscreenBtn">⛶ Pantalla completa</button>

    <p class="hint">Gira el celular para verlo más grande · pellizca para hacer zoom · desliza para pasar de página</p>
  </div>

  <noscript>Este anuario necesita JavaScript activado para mostrarse.</noscript>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const viewport = document.getElementById('viewport');
      const bookScene = document.getElementById('bookScene');
      const zoomContainer = document.getElementById('zoomContainer');
      const pageInfo = document.getElementById('pageNumber');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');

      // Tus 36 imágenes en orden exacto.
      // OJO en GitHub Pages: los nombres deben coincidir EXACTAMENTE (mayúsculas, minúsculas y extensión).
      const imageFiles = [
        'Page_0.jpg',
        'Page_0,5.jpg',
        ...Array.from({ length: 32 }, (_, i) => `Page_${String(i + 1).padStart(2, '0')}.jpg`),
        'Page_32,5.jpg',
        'Page_33.jpg'
      ];

      const TOTAL_PAGES = imageFiles.length;          // 36 páginas
      const TOTAL_SHEETS = Math.ceil(TOTAL_PAGES / 2); // 18 hojas de papel (frente y dorso)
      const FLIP_MS = 700;                             // duración del giro de una hoja (igual que en el CSS)
      const PAGE_RATIO = 2 / 1.4142;                   // ancho / alto de dos páginas A4 juntas
      const MAX_ZOOM = 3;
      const sheets = [];

      // ---------- Construcción del libro ----------
      function createFace(className, file, pageNumber) {
        const face = document.createElement('div');
        face.className = 'face ' + className;
        if (!file) return face;

        face.classList.add('loading');
        face.dataset.file = file;

        const img = document.createElement('img');
        img.alt = `Página ${pageNumber}`;
        img.decoding = 'async';
        img.draggable = false;
        img.dataset.src = file; // se carga solo cuando la página está cerca (ver load)

        img.addEventListener('load', () => {
          // Se decodifica antes de mostrarla, para que el giro no se trabe al aparecer la imagen
          const show = () => {
            face.classList.remove('loading');
            face.classList.add('ready');
          };
          if (img.decode) img.decode().then(show, show); else show();
        });
        img.addEventListener('error', () => {
          face.classList.remove('loading');
          face.classList.add('missing');
          img.remove();
          console.warn('No se pudo cargar la imagen:', file);
        });

        const shade = document.createElement('div');
        shade.className = 'shade';

        face.appendChild(img);
        face.appendChild(shade);
        return face;
      }

      for (let i = 0; i < TOTAL_SHEETS; i++) {
        const sheet = document.createElement('div');
        sheet.className = 'sheet';
        if (i === 0) sheet.classList.add('is-cover');
        if (i === TOTAL_SHEETS - 1) sheet.classList.add('is-backcover');

        sheet.appendChild(createFace('front', imageFiles[i * 2], i * 2 + 1));
        sheet.appendChild(createFace('back', imageFiles[i * 2 + 1], i * 2 + 2));

        // Clic en la hoja derecha avanza, en la izquierda retrocede
        // (si el clic fue parte de un arrastre o deslizamiento, se ignora)
        sheet.addEventListener('click', () => {
          if (gestureMoved) return;
          turn(sheet.classList.contains('flipped') ? -1 : 1);
        });

        bookScene.appendChild(sheet);
        sheets.push(sheet);
      }

      // Carga las imágenes de una hoja solo cuando se necesitan
      const warmed = new Set();
      function load(sheetIndex) {
        const sheet = sheets[sheetIndex];
        if (!sheet) return;
        warmed.add(sheetIndex);
        sheet.querySelectorAll('img[data-src]').forEach((img) => {
          img.src = img.dataset.src;
          img.removeAttribute('data-src');
        });
      }

      // Descarga en segundo plano el resto de las páginas (de una en una, sin decodificarlas),
      // empezando por las más cercanas a la que se está leyendo. Así los giros siguientes salen de la caché.
      let warming = false;
      function warmCache() {
        if (warming) return;
        if (navigator.connection && navigator.connection.saveData) return; // respeta el ahorro de datos
        let next = -1;
        for (let i = 0; i < TOTAL_SHEETS; i++) {
          if (warmed.has(i)) continue;
          if (next === -1 || Math.abs(i - currentSheet) < Math.abs(next - currentSheet)) next = i;
        }
        if (next === -1) return;
        warming = true;
        warmed.add(next);
        const urls = imageFiles.slice(next * 2, next * 2 + 2).filter(Boolean);
        let pending = urls.length;
        const done = () => {
          if (--pending > 0) return;
          warming = false;
          setTimeout(warmCache, 200);
        };
        if (!pending) { warming = false; return; }
        // Image() funciona igual abriendo el archivo directo o desde GitHub Pages, sin errores en la consola
        urls.forEach((u) => {
          const im = new Image();
          im.onload = im.onerror = done;
          im.src = u;
        });
      }
      window.addEventListener('load', () => setTimeout(warmCache, 800));

      // ---------- Estado y páginas ----------
      let currentSheet = 0; // 0 = Portada cerrada, 1..17 = Abierto, 18 = Contraportada
      let busy = false;     // evita pasar de página mientras una hoja está girando

      function render() {
        // Orden de capas (z-index) para que nunca se crucen ni se vean hojas de abajo
        sheets.forEach((sheet, index) => {
          sheet.classList.toggle('flipped', index < currentSheet);
          // Las hojas lejanas no se dibujan (mucho menos trabajo para el celular)
          sheet.classList.toggle('far', index < currentSheet - 3 || index > currentSheet + 2);
          sheet.style.zIndex = index < currentSheet ? index + 1 : TOTAL_SHEETS - index;
        });

        // Posición del libro y texto
        if (currentSheet === 0) {
          bookScene.className = 'book-scene closed-front';
          pageInfo.textContent = 'Portada';
        } else if (currentSheet === TOTAL_SHEETS) {
          bookScene.className = 'book-scene closed-back';
          pageInfo.textContent = 'Contraportada';
        } else {
          bookScene.className = 'book-scene is-open';
          const leftPage = currentSheet * 2;
          const rightPage = leftPage + 1;
          pageInfo.textContent = `Páginas ${leftPage} - ${rightPage} de ${TOTAL_PAGES}`;
        }

        prevBtn.disabled = currentSheet === 0;
        nextBtn.disabled = currentSheet === TOTAL_SHEETS;

        // Carga solo las hojas cercanas (así el anuario abre rápido y no satura el celular)
        for (let i = currentSheet - 2; i <= currentSheet + 3; i++) load(i);
      }

      function turn(dir) {
        if (busy) return;
        const target = currentSheet + dir;
        if (target < 0 || target > TOTAL_SHEETS) return;

        busy = true;
        const turning = sheets[dir > 0 ? currentSheet : target];
        turning.classList.add('turning');
        currentSheet = target;
        render();
        turning.style.zIndex = 100; // la hoja que gira va por encima de todas
        setTimeout(() => {
          turning.classList.remove('turning');
          render();
          busy = false;
        }, FLIP_MS + 30);
      }

      // Tamaño del libro según el espacio disponible (deja margen para la sombra y la perspectiva del giro)
      function fitBook() {
        const w = viewport.clientWidth;
        const h = viewport.clientHeight;
        const height = Math.max(100, Math.min(h * 0.88, (w * 0.94) / PAGE_RATIO));
        bookScene.style.height = `${height}px`;
        // La perspectiva crece con el libro, así el giro se ve igual de natural en pantallas chicas y grandes
        bookScene.style.perspective = `${Math.round(height * 7)}px`;
      }

      fitBook();
      render();
      window.addEventListener('resize', fitBook);
      window.addEventListener('orientationchange', () => setTimeout(fitBook, 200));
      window.addEventListener('load', fitBook);

      // ---------- Botones y teclado ----------
      prevBtn.addEventListener('click', () => turn(-1));
      nextBtn.addEventListener('click', () => turn(1));

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') turn(1);
        if (e.key === 'ArrowLeft') turn(-1);
      });

      // ---------- Zoom, arrastre y deslizar (mouse y pantalla táctil) ----------
      let zoom = 1, panX = 0, panY = 0;
      let gestureMoved = false;
      let swipeStart = null;
      let pinchStart = null;
      const pointers = new Map();
      const zoomResetBtn = document.getElementById('zoomResetBtn');

      function applyZoom(animate = true) {
        zoom = Math.min(MAX_ZOOM, Math.max(1, zoom));
        if (zoom === 1) { panX = 0; panY = 0; }

        // El libro no puede salirse de la pantalla al arrastrarlo
        const maxX = ((zoom - 1) * viewport.clientWidth) / 2;
        const maxY = ((zoom - 1) * viewport.clientHeight) / 2;
        panX = Math.min(maxX, Math.max(-maxX, panX));
        panY = Math.min(maxY, Math.max(-maxY, panY));

        zoomContainer.style.transition = animate ? '' : 'none';
        zoomContainer.classList.toggle('zoomed', zoom > 1);
        zoomContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
        zoomResetBtn.textContent = `${Math.round(zoom * 100)}%`;
      }

      document.getElementById('zoomInBtn').addEventListener('click', () => {
        zoom = +(zoom + 0.25).toFixed(2);
        applyZoom();
      });
      document.getElementById('zoomOutBtn').addEventListener('click', () => {
        zoom = +(zoom - 0.25).toFixed(2);
        applyZoom();
      });
      zoomResetBtn.addEventListener('click', () => {
        zoom = 1;
        applyZoom();
      });

      viewport.addEventListener('pointerdown', (e) => {
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pointers.size === 1) {
          gestureMoved = false;
          swipeStart = { x: e.clientX, y: e.clientY, panX, panY };
        } else if (pointers.size === 2) {
          gestureMoved = true;
          const [a, b] = [...pointers.values()];
          pinchStart = { dist: Math.hypot(a.x - b.x, a.y - b.y), zoom };
        }
      });

      window.addEventListener('pointermove', (e) => {
        if (!pointers.has(e.pointerId)) return;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        // Pellizcar con dos dedos para acercar o alejar
        if (pointers.size === 2 && pinchStart) {
          const [a, b] = [...pointers.values()];
          const dist = Math.hypot(a.x - b.x, a.y - b.y);
          zoom = pinchStart.zoom * (dist / pinchStart.dist);
          applyZoom(false);
          return;
        }

        // Un dedo o el mouse: mover el libro si hay zoom
        if (pointers.size === 1 && swipeStart) {
          const dx = e.clientX - swipeStart.x;
          const dy = e.clientY - swipeStart.y;
          if (Math.hypot(dx, dy) > 6) gestureMoved = true;
          if (zoom > 1 && gestureMoved) {
            panX = swipeStart.panX + dx;
            panY = swipeStart.panY + dy;
            applyZoom(false);
          }
        }
      });

      function endPointer(e) {
        if (!pointers.has(e.pointerId)) return;
        pointers.delete(e.pointerId);

        if (pinchStart && pointers.size < 2) {
          pinchStart = null;
          swipeStart = null; // el dedo que queda no debe mover ni pasar página
        }

        if (pointers.size === 0) {
          // Deslizar horizontalmente (sin zoom) pasa de página
          if (swipeStart && zoom === 1 && e.type === 'pointerup') {
            const dx = e.clientX - swipeStart.x;
            const dy = e.clientY - swipeStart.y;
            if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
              turn(dx < 0 ? 1 : -1);
            }
          }
          swipeStart = null;
          applyZoom();
        }
      }
      window.addEventListener('pointerup', endPointer);
      window.addEventListener('pointercancel', endPointer);

      // ---------- Pantalla completa (no existe en iPhone, ahí se oculta el botón) ----------
      const fullscreenBtn = document.getElementById('fullscreenBtn');
      const root = document.documentElement;
      const requestFS = root.requestFullscreen || root.webkitRequestFullscreen;
      const exitFS = document.exitFullscreen || document.webkitExitFullscreen;
      const currentFS = () => document.fullscreenElement || document.webkitFullscreenElement;

      if (!requestFS) {
        fullscreenBtn.style.display = 'none';
      } else {
        fullscreenBtn.addEventListener('click', () => {
          const result = currentFS() ? exitFS.call(document) : requestFS.call(root);
          if (result && result.catch) result.catch(() => {});
        });
        const onFullscreenChange = () => {
          fullscreenBtn.textContent = currentFS() ? '✕ Salir' : '⛶ Pantalla completa';
          fitBook();
        };
        document.addEventListener('fullscreenchange', onFullscreenChange);
        document.addEventListener('webkitfullscreenchange', onFullscreenChange);
      }
    });
  </script>

  <script>
    // Cuadrícula y numeración de la mesa: se ajustan al tamaño de la pantalla
    (function () {
      const mesa = document.querySelector('.mesa');
      const nums = mesa && mesa.querySelector('.nums');
      if (!nums) return;
      function build() {
        const w = window.innerWidth, h = window.innerHeight;
        const g = Math.max(64, Math.round(Math.min(w, h) / 6.4 / 4) * 4); // múltiplo de 4
        mesa.style.setProperty('--g', g + 'px');
        let out = '';
        for (let i = 1; i < Math.ceil(w / g); i++) {
          out += `<span style="left:${i * g + 5}px;top:6px">${i}</span><span style="left:${i * g + 5}px;bottom:6px">${i}</span>`;
        }
        for (let j = 1; j < Math.ceil(h / g); j++) {
          out += `<span style="top:${j * g + 4}px;left:6px">${j}</span><span class="d" style="top:${j * g + 4}px;right:6px">${j}</span>`;
        }
        nums.innerHTML = out;
      }
      build();
      window.addEventListener('resize', build);
    })();
  </script>
</body>
</html>
